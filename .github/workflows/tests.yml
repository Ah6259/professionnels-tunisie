# Tests à chaque modification du site (e-mail GitHub à Ahmed si un test échoue).
name: tests
# Audit des robots du 10/10/2026 : pas de tests pour un envoi qui ne change que des notes (.md) ; un nouvel envoi annule le précédent.
on:
  push:
    branches: [main, "entretien-tests/**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read      # audit de sécurité du 16/10/2026 : ce robot ne fait que lire
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install --no-save --no-package-lock jsdom
      - run: node tools/test_site.mjs
      # Visiteur simulé (règle générale du 18/10/2026) : téléphone de 390 px dans Chrome, recherches par nom / gouvernorat / métier,
      # une fiche ouverte (tools/scenarios-visiteur.json, fabriqué par construire.mjs) : signale les problèmes AVANT le visiteur réel.
      - name: Visiteur simule
        run: python3 tools/visiteur_simule.py

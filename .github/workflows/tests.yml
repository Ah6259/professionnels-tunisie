# Tests à chaque modification du site (e-mail GitHub à Ahmed si un test échoue).
name: tests
on: [push, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install --no-save --no-package-lock jsdom
      - run: node tools/test_site.mjs
